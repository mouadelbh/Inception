server {
    # Listen ONLY on HTTPS
    listen 443 ssl;

    server_name mel-bouh.42.fr;

    # Root directory (must match the shared WordPress volume)
    root /var/www/html;
    index index.php index.html;

    # TLS configuration
    ssl_certificate     /etc/ssl/certs/nginx.crt;
    ssl_certificate_key /etc/ssl/private/nginx.key;

    # Allow ONLY TLS 1.2 and 1.3 (Inception requirement)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Main WordPress routing
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP handling (php-fpm)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;

        # IMPORTANT:
        # "wordpress" MUST be the docker-compose service name
        # 9000 MUST match php-fpm listen port
        fastcgi_pass wordpress:9000;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # BONUS: Adminer - Database management interface
    # Proxies requests to the Adminer container
    location /adminer {
        # Rewrite /adminer to /adminer.php for cleaner URL
        rewrite ^/adminer$ /adminer.php break;
        
        # Proxy to Adminer container (port 8080)
        proxy_pass http://adminer:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BONUS: Static portfolio site (no PHP)
    # Accessible at /portfolio or /static
    location /portfolio {
        # Proxy to static-site container
        proxy_pass http://static-site:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BONUS: Uptime Monitor - Website health monitoring dashboard
    # Accessible at /uptime
    location /uptime {
        # Proxy to uptime-monitor container (Flask web server on port 5000)
        proxy_pass http://uptime-monitor:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to hidden files (.htaccess, .env, etc.)
    location ~ /\. {
        deny all;
    }
}