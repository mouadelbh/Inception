# vsftpd configuration for Docker
# Very Secure FTP Daemon configuration

# Run in foreground (required for Docker)
background=NO

# Disable anonymous access (security!)
anonymous_enable=NO

# Allow local users to login
local_enable=YES

# Allow uploads and modifications
write_enable=YES

# Set file permissions: 022 means files are readable by everyone
local_umask=022

# Show directory messages
dirmessage_enable=YES

# Enable logging
xferlog_enable=YES
xferlog_std_format=YES
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log

# Connection settings
listen=YES
listen_ipv6=NO

# PAM authentication
pam_service_name=vsftpd

# Passive mode configuration (required for Docker NAT)
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
# pasv_address will be set by setup.sh

# Chroot users to their home directory (security)
chroot_local_user=YES
allow_writeable_chroot=YES

# Security: Hide user IDs
hide_ids=YES

# Seccomp sandbox (disabled for compatibility)
seccomp_sandbox=NO
