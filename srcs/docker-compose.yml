services:
  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - inception
    restart: unless-stopped
  wordpress:
    container_name: wordpress
    build:
      context: ./requirements/wordpress
    env_file:
      - .env
    expose:
      - "9000"
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb
      - redis
    networks:
      - inception
    restart: unless-stopped
  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html:ro
    depends_on:
      - wordpress
    networks:
      - inception
    ports:
      - "443:443"
    restart: unless-stopped

  # BONUS: Adminer - Database management web interface
  adminer:
    container_name: adminer
    build:
      context: ./requirements/bonus/adminer
    depends_on:
      - mariadb
    networks:
      - inception
    expose:
      - "8080"
    restart: unless-stopped

  # BONUS: Static website (portfolio) - no PHP
  static-site:
    container_name: static-site
    build:
      context: ./requirements/bonus/static-site
    networks:
      - inception
    expose:
      - "8080"
    restart: unless-stopped

  # BONUS: Redis cache for WordPress
  redis:
    container_name: redis
    build:
      context: ./requirements/bonus/redis
    networks:
      - inception
    expose:
      - "6379"
    restart: unless-stopped

  # BONUS: FTP server for WordPress file management
  ftp:
    container_name: ftp
    build:
      context: ./requirements/bonus/ftp
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    networks:
      - inception
    restart: unless-stopped

  # BONUS: Uptime Monitor - Website health monitoring service
  uptime-monitor:
    container_name: uptime-monitor
    build:
      context: ./requirements/bonus/uptime-monitor
    networks:
      - inception
    expose:
      - "5000"
    volumes:
      - uptime_monitor_data:/data
    restart: unless-stopped

volumes:
  uptime_monitor_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mel-bouh/data/uptime-monitor
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mel-bouh/data/mysql
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mel-bouh/data/www

networks:
  inception:
    driver: bridge